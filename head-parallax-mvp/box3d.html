<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Head-Tracked 3D Box</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  #ui { position: fixed; left: 12px; top: 12px; color: #fff; font-size: 13px; width: 250px;
        background: rgba(0,0,0,.55); padding: 10px 12px; border-radius: 8px; }
  #ui button { font-size: 14px; padding: 6px 10px; margin-top: 6px; cursor: pointer; }
  #ui label { display: block; margin-top: 8px; }
  #ui input[type=range] { width: 100%; }
  #video { position: fixed; right: 12px; bottom: 12px; width: 160px; border-radius: 8px;
           transform: scaleX(-1); opacity: .7; display: none; }
</style>
</head>
<body>
<video id="video" playsinline muted></video>
<div id="ui">
  <div id="status">Mode: mouse (move the mouse to look around)</div>
  <button id="camBtn">Use webcam head tracking</button>
  <select id="camSelect" style="display:none;margin-top:6px;max-width:100%"></select>
  <label>Screen width: <span id="wVal">80</span> cm
    <input id="screenW" type="range" min="30" max="120" step="1" value="80"></label>
  <label>Head movement scale
    <input id="scale" type="range" min="0.3" max="3" step="0.05" value="1"></label>
  <label>Tunnel depth
    <input id="depth" type="range" min="40" max="250" step="5" value="120"></label>
  <label><input id="flip" type="checkbox"> Flip left/right</label>
  <div style="margin-top:8px;opacity:.8">Press <b>H</b> to hide this panel, <b>F</b> for full screen.</div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const $ = id => document.getElementById(id);
const statusEl = $('status');

// ---------- Renderer / scene ----------
// World units are centimetres. The physical screen is a rectangle centred at (0,0,0)
// facing +z (toward you). Everything with z < 0 is "behind the glass".
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04050c);
const camera = new THREE.PerspectiveCamera();   // projection is set by hand every frame
const world = new THREE.Group(); scene.add(world);

const rng = seed => () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const NEON = [0xff4d8d, 0x46e0ff, 0xffd34d, 0x9b7bff, 0x5dff9a];

let screenW = 80, screenH = 45, depth = 120;
const anim = [];

function build() {
  world.clear(); anim.length = 0;
  screenW = Number($('screenW').value);
  screenH = screenW * innerHeight / innerWidth;
  depth = Number($('depth').value);
  const W = screenW, H = screenH, D = depth;

  // --- grid tunnel: rings every 10 cm + lines running along the walls ---
  const pts = [];
  for (let z = 0; z >= -D; z -= 10) {
    pts.push(-W/2,-H/2,z,  W/2,-H/2,z,   W/2,-H/2,z,  W/2,H/2,z,
             W/2,H/2,z,   -W/2,H/2,z,   -W/2,H/2,z, -W/2,-H/2,z);
  }
  const nx = 8, ny = 5;
  for (let i = 0; i <= nx; i++) { const x = -W/2 + W*i/nx;
    pts.push(x,-H/2,0, x,-H/2,-D,  x,H/2,0, x,H/2,-D); }
  for (let j = 0; j <= ny; j++) { const y = -H/2 + H*j/ny;
    pts.push(-W/2,y,0, -W/2,y,-D,  W/2,y,0, W/2,y,-D); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  world.add(new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: 0x2a4f9c })));

  // back wall glow so the far end reads clearly
  const back = new THREE.Mesh(new THREE.PlaneGeometry(W, H),
    new THREE.MeshBasicMaterial({ color: 0x0b1030 }));
  back.position.z = -D - 0.1; world.add(back);

  // --- lights ---
  world.add(new THREE.AmbientLight(0xffffff, 0.5));
  const pl = new THREE.PointLight(0xffffff, 6000, 0, 2); pl.position.set(0, H * 0.2, 30); world.add(pl);

  // --- floating objects at many depths (some poke out in front of the screen) ---
  const r = rng(42);
  const geos = [
    () => new THREE.SphereGeometry(1, 32, 24),
    () => new THREE.BoxGeometry(1.6, 1.6, 1.6),
    () => new THREE.OctahedronGeometry(1.3),
    () => new THREE.TorusGeometry(1, 0.35, 16, 40),
  ];
  const count = 22;
  for (let i = 0; i < count; i++) {
    const t = i / (count - 1);
    const z = 18 - t * (D + 10);                       // from +18 (in front) to far back
    const size = 3 + r() * 4;
    const m = new THREE.Mesh(geos[Math.floor(r() * geos.length)](),
      new THREE.MeshStandardMaterial({ color: NEON[i % NEON.length], roughness: 0.35, metalness: 0.2,
                                       emissive: NEON[i % NEON.length], emissiveIntensity: 0.25 }));
    m.scale.setScalar(size);
    m.position.set((r() - 0.5) * (W - size * 2.5), (r() - 0.5) * (H - size * 2.5), z);
    m.userData.spin = (r() - 0.5) * 0.02;
    anim.push(m); world.add(m);
    // a thin line from each object to the floor makes its height/depth easier to read
    const lg = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(m.position.x, m.position.y, z), new THREE.Vector3(m.position.x, -H/2, z)]);
    world.add(new THREE.Line(lg, new THREE.LineBasicMaterial({ color: 0x1d2c5a })));
  }
  scene.fog = new THREE.Fog(0x04050c, 60, D + 160);
}

function resize() { renderer.setSize(innerWidth, innerHeight); build(); }
addEventListener('resize', resize);
['screenW', 'depth'].forEach(id => $(id).addEventListener('input', () => { $('wVal').textContent = $('screenW').value; build(); }));
resize();

// ---------- Eye position in cm, relative to the screen centre ----------
const eyeTarget = new THREE.Vector3(0, 0, 60);
const eye = eyeTarget.clone();
let usingCam = false;

addEventListener('mousemove', e => {
  if (usingCam) return;
  const s = Number($('scale').value);
  eyeTarget.x = ((e.clientX / innerWidth) * 2 - 1) * 30 * s;
  eyeTarget.y = -((e.clientY / innerHeight) * 2 - 1) * 20 * s;
});
addEventListener('keydown', e => {
  if (e.key === 'h') $('ui').style.display = $('ui').style.display === 'none' ? 'block' : 'none';
  if (e.key === 'f') document.documentElement.requestFullscreen?.();
});

// ---------- Off-axis projection: the heart of the effect ----------
// The camera sits at your eye. The screen rectangle is the "window" the frustum must pass through.
function updateCamera() {
  const near = 1, far = depth + 400;
  camera.position.copy(eye);
  camera.quaternion.identity();                      // always look straight at the screen plane
  const k = near / eye.z;
  const left = (-screenW / 2 - eye.x) * k, right = (screenW / 2 - eye.x) * k;
  const bottom = (-screenH / 2 - eye.y) * k, top = (screenH / 2 - eye.y) * k;
  camera.projectionMatrix.makePerspective(left, right, top, bottom, near, far);
  camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();
  camera.updateMatrixWorld(true);
}

function frame() {
  eye.lerp(eyeTarget, 0.2);                           // smoothing against webcam jitter
  anim.forEach(m => { m.rotation.x += m.userData.spin; m.rotation.y += m.userData.spin * 1.4; });
  updateCamera();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();

// ---------- Webcam head tracking (MediaPipe face detector) ----------
$('camBtn').addEventListener('click', async () => {
  statusEl.textContent = 'Loading face tracker...';
  try {
    const vision = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
    const fileset = await vision.FilesetResolver.forVisionTasks(
      'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    const detector = await vision.FaceDetector.createFromOptions(fileset, {
      baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite' },
      runningMode: 'VIDEO',
    });
    const video = $('video'), sel = $('camSelect');
    const startStream = async deviceId => {
      video.srcObject?.getTracks().forEach(t => t.stop());
      video.srcObject = await navigator.mediaDevices.getUserMedia({
        video: deviceId ? { deviceId: { exact: deviceId } } : { width: 640, height: 480 } });
      await video.play();
    };
    await startStream();
    const cams = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
    sel.innerHTML = cams.map(d => `<option value="${d.deviceId}">${d.label || 'Camera'}</option>`).join('');
    sel.style.display = 'block';
    sel.value = video.srcObject.getVideoTracks()[0].getSettings().deviceId;
    sel.onchange = () => startStream(sel.value);
    video.style.display = 'block';
    usingCam = true;
    statusEl.textContent = 'Mode: webcam (move your head)';

    const loop = () => {
      if (video.readyState >= 2) {
        const box = detector.detectForVideo(video, performance.now()).detections[0]?.boundingBox;
        if (box) {
          const s = Number($('scale').value) * ($('flip').checked ? -1 : 1);
          const cx = (box.originX + box.width / 2) / video.videoWidth;
          const cy = (box.originY + box.height / 2) / video.videoHeight;
          const wFrac = box.width / video.videoWidth;
          // Camera image isn't mirrored: head moving right shows up as the box moving left.
          eyeTarget.x = -(cx - 0.5) * 80 * s;
          eyeTarget.y = -(cy - 0.5) * 60 * Math.abs(s);
          // Face looks bigger when you're closer. 0.2 of the frame ~ 60 cm is a rough guess.
          eyeTarget.z = Math.min(120, Math.max(30, 60 * (0.2 / wFrac)));
        }
      }
      requestAnimationFrame(loop);
    };
    loop();
  } catch (err) {
    console.error(err);
    statusEl.textContent = 'Webcam failed: ' + err.message + ' (still using mouse)';
  }
});
</script>
</body>
</html>
